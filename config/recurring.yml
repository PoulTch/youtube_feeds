# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  # НАШ РОБОТ ДЛЯ PRODUCTION (ТЕПЕРЬ КАЖДЫЙ ЧАС НА ПОЛНОМ АВТОПИЛОТЕ!)
  refresh_all_channels:
    class: RefreshAllChannelsJob
    schedule: "every 1 hour"


# НАШ РОБОТ ДЛЯ DEVELOPMENT (каждый час, чтобы тестировать обновления каналов в реальном времени)
development:
  refresh_all_channels:
    class: RefreshAllChannelsJob
    schedule: "every 1 hour"